name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  java:
    name: Java build + tests (JDK 21, Testcontainers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # verify = unit tests (surefire) + *IT integration tests (failsafe) against real Postgres/Kafka containers.
      - run: mvn -B -ntp verify
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/

  frontend:
    name: Frontend lint, typecheck, tests, build, audit
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Runtime dependencies only: dev tooling advisories are reviewed in docs/production-readiness.md.
      - run: npm audit --omit=dev --audit-level=high

  compose:
    name: Compose config validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose -f infra/compose/docker-compose.yml --env-file .env config --quiet
      - run: docker compose -f infra/compose/docker-compose.yml --env-file .env --profile monitoring config --quiet
