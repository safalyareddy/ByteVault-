# ByteVault local topology (ADR-0008). Run via scripts/up.sh, which passes --env-file ../../.env.
# Host ports bind to 127.0.0.1 only and avoid the dev machine's existing 5432/8080 services.
name: bytevault

x-node: &node
  # One image shared by all three nodes; identity comes only from environment and volume.
  image: bytevault-storage-node:dev
  build:
    context: ../../storage-node
  restart: unless-stopped
  mem_limit: 256m
  environment: &node-env
    BV_CONTROL_PLANE_URL: http://backend:8090
    BV_HEARTBEAT_INTERVAL: ${BV_HEARTBEAT_INTERVAL:-5s}
    BV_NODE_MAX_CHUNK_BYTES: ${BV_NODE_MAX_CHUNK_BYTES:-67108864}
    LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash

services:
  postgres:
    image: postgres:16.9-alpine
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: bytevault
      POSTGRES_USER: ${DATABASE_USERNAME:?set in .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:${BV_POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d bytevault"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    mem_limit: 1g
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${BV_KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "127.0.0.1:${BV_KAFKA_HOST_PORT:-9092}:9092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  backend:
    image: bytevault-backend:dev
    build:
      context: ../../backend
    restart: unless-stopped
    mem_limit: 768m
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/bytevault
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      BV_CHUNK_SIZE_BYTES: ${BV_CHUNK_SIZE_BYTES:-4194304}
      BV_REPLICATION_FACTOR: ${BV_REPLICATION_FACTOR:-3}
      BV_MAX_UPLOAD_BYTES: ${BV_MAX_UPLOAD_BYTES:-1073741824}
      BV_HEARTBEAT_INTERVAL: ${BV_HEARTBEAT_INTERVAL:-5s}
      BV_SUSPECT_AFTER: ${BV_SUSPECT_AFTER:-15s}
      BV_OFFLINE_AFTER: ${BV_OFFLINE_AFTER:-45s}
      BV_SCRUB_INTERVAL: ${BV_SCRUB_INTERVAL:-10m}
      BV_NODE_SECRETS: node-1:${BV_NODE_1_SECRET:?set in .env},node-2:${BV_NODE_2_SECRET:?set in .env},node-3:${BV_NODE_3_SECRET:?set in .env}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash
    ports:
      - "127.0.0.1:${BV_BACKEND_HOST_PORT:-8090}:8090"

  node-1:
    <<: *node
    environment:
      <<: *node-env
      BV_NODE_ID: node-1
      BV_NODE_AUTH_SECRET: ${BV_NODE_1_SECRET:?set in .env}
      BV_NODE_ADVERTISED_ENDPOINT: http://node-1:9100
    ports: ["127.0.0.1:9101:9100"]
    volumes: ["node1-data:/var/lib/bytevault/node"]

  node-2:
    <<: *node
    environment:
      <<: *node-env
      BV_NODE_ID: node-2
      BV_NODE_AUTH_SECRET: ${BV_NODE_2_SECRET:?set in .env}
      BV_NODE_ADVERTISED_ENDPOINT: http://node-2:9100
    ports: ["127.0.0.1:9102:9100"]
    volumes: ["node2-data:/var/lib/bytevault/node"]

  node-3:
    <<: *node
    environment:
      <<: *node-env
      BV_NODE_ID: node-3
      BV_NODE_AUTH_SECRET: ${BV_NODE_3_SECRET:?set in .env}
      BV_NODE_ADVERTISED_ENDPOINT: http://node-3:9100
    ports: ["127.0.0.1:9103:9100"]
    volumes: ["node3-data:/var/lib/bytevault/node"]

  prometheus:
    image: prom/prometheus:v3.4.1
    profiles: ["monitoring"]
    mem_limit: 256m
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    image: grafana/grafana:12.0.2
    profiles: ["monitoring"]
    mem_limit: 256m
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-locally}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports: ["127.0.0.1:3001:3000"]

volumes:
  pgdata:
  kafkadata:
  node1-data:
  node2-data:
  node3-data:
