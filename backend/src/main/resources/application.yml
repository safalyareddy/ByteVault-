server:
  port: ${SERVER_PORT:8090}
  shutdown: graceful
  tomcat:
    threads:
      max: ${BV_HTTP_MAX_THREADS:64}
    connection-timeout: 20s

spring:
  application:
    name: bytevault-backend
  lifecycle:
    timeout-per-shutdown-phase: 20s
  mvc:
    # PUT bodies are raw chunk bytes; never let the form filter consume them.
    formcontent:
      filter:
        enabled: false
    async:
      request-timeout: 30m
  task:
    execution:
      pool:
        core-size: 8
        max-size: 32
        queue-capacity: 100
  threads:
    virtual:
      enabled: false
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:55432/bytevault}
    username: ${DATABASE_USERNAME:bytevault}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${BV_DB_POOL_SIZE:10}
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: false
      operation-timeout: 10s
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        # Fail fast during a broker outage; the outbox keeps the events and retries.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 12000
        linger.ms: 5
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      max-poll-records: 50
    listener:
      ack-mode: record
      missing-topics-fatal: false

bytevault:
  admin-token: ${BV_ADMIN_TOKEN:}
  chunk-size-bytes: ${BV_CHUNK_SIZE_BYTES:4194304}
  replication-factor: ${BV_REPLICATION_FACTOR:3}
  max-upload-bytes: ${BV_MAX_UPLOAD_BYTES:1073741824}
  heartbeat-interval: ${BV_HEARTBEAT_INTERVAL:5s}
  suspect-after: ${BV_SUSPECT_AFTER:15s}
  offline-after: ${BV_OFFLINE_AFTER:45s}
  scrub-interval: ${BV_SCRUB_INTERVAL:10m}
  cluster:
    nodes: ${BV_NODES:}
    node-secrets: ${BV_NODE_SECRETS:}
    node-request-timeout: ${BV_NODE_REQUEST_TIMEOUT:30s}
    max-concurrent-chunk-transfers: ${BV_MAX_CONCURRENT_CHUNK_TRANSFERS:8}
    upload-session-ttl: ${BV_UPLOAD_SESSION_TTL:24h}
    admission-heartbeats: ${BV_ADMISSION_HEARTBEATS:2}
    node-free-space-reserve-bytes: ${BV_NODE_FREE_SPACE_RESERVE_BYTES:268435456}
  repair:
    enabled: ${BV_REPAIR_ENABLED:true}
    max-concurrent: ${BV_REPAIR_MAX_CONCURRENT:2}
    lease: ${BV_REPAIR_LEASE:2m}
    max-attempts: ${BV_REPAIR_MAX_ATTEMPTS:5}
    capacity-wait: ${BV_REPAIR_CAPACITY_WAIT:30s}
    scrub:
      enabled: ${BV_SCRUB_ENABLED:true}
      batch-size: ${BV_SCRUB_BATCH_SIZE:50}
      pause-between-chunks: ${BV_SCRUB_PAUSE:20ms}
  kafka:
    topic-partitions: ${BV_KAFKA_TOPIC_PARTITIONS:3}
    topic-replication-factor: ${BV_KAFKA_TOPIC_REPLICATION:1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,kafka
        liveness:
          include: livenessState
  metrics:
    tags:
      application: bytevault-backend

logging:
  pattern:
    level: "%5p [cid=%X{correlationId:-}]"
